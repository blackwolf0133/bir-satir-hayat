# Paylaşım sırasını bozmadan deneme videosu: daha önce çizilmiş bir bölümün görselleriyle
# yeni ses (Gemini) ve hareketli görsellerle video üretir, "onizleme-..." sürümüne koyar. Hiçbir şey paylaşmaz.
name: Önizleme

on:
  workflow_dispatch:
    inputs:
      bolum:
        description: "Görselleri hazır (cizim-<id> sürümü olan) bölüm"
        default: "003"
      ses:
        description: "gemini ya da chatterbox"
        default: "gemini"

permissions:
  contents: write

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Kurulum
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          pip install chatterbox-tts huggingface_hub
          pip install -r requirements.txt
          pip install faster-whisper || echo "::warning::faster-whisper kurulamadı, okunuş kontrolü atlanacak"
          pip install transformers || true
      - name: Önbellek (modeller)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: chatterbox-mtl-v1
      - name: Görselleri al
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "cizim-${{ inputs.bolum }}" -D img --repo "${{ github.repository }}" && ls img
      - name: Videoyu üret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_VOICE: "Fenrir"
          PYTHONUNBUFFERED: "1"
          VOICE_ENGINE: ${{ inputs.ses }}
        run: |
          ep=$(ls episodes/${{ inputs.bolum }}_*.json)
          mkdir -p out && python -m engine.make "$ep" img "out/${{ inputs.bolum }}.mp4"
      - name: Önizleme sürümüne koy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "onizleme-${{ inputs.bolum }}-$(date +%m%d%H%M)" "out/${{ inputs.bolum }}.mp4" --prerelease \
            --title "Önizleme ${{ inputs.bolum }}" --notes "Deneme videosu, paylaşılmadı." --repo "${{ github.repository }}"
