# Görsel kalite kontrolünü "kalite-test" sürümündeki resimle dener. Hiçbir şey paylaşmaz.
name: Kalite testi
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dene
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install -q huggingface_hub
          sudo apt-get install -y -q ffmpeg >/dev/null
          gh release download hazir-006 -D v --repo "${{ github.repository }}"
          mkdir -p img && ffmpeg -v error -y -ss 1.0 -i v/006.mp4 -frames:v 1 -vf "crop=1080:1280:0:640" img/hatali_sahne1.png
          python tools/kalite_test.py img/hatali_sahne1.png "A father sits quietly at a kitchen table at dawn, drinking tea, looking out the window, thoughtful."
