# Sıradaki bölümü ÖNCEDEN üretir: 5 sahne aynı anda 5 makinede çizilir (FLUX.2-klein-4B),
# sonra senin sesinle birleştirilip "hazir-<id>" sürümüne konur. Önde 3 hazır bölüm olana kadar kendini tekrar başlatır.
name: Hazırla

on:
  schedule:
    - cron: "17 9 * * *"     # 12:17 Türkiye (yedek; paylaşım sonrası da otomatik başlar)
  workflow_dispatch:
    inputs:
      bolum:
        description: "Belirli bölümleri yeniden üret (ör. 003 004). Boşsa sıradaki."
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: hazirla
  cancel-in-progress: false

jobs:
  sec:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.sec.outputs.id }}
      path: ${{ steps.sec.outputs.path }}
      rest: ${{ steps.sec.outputs.rest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sıradaki bölümü seç
        id: sec
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_ID: ${{ inputs.bolum }}
        run: |
          python daily.py status
          export READY="$(gh release list --repo "${{ github.repository }}" --limit 100 --json tagName --jq '.[].tagName' | grep '^hazir-' | sed 's/^hazir-//' | tr '\n' ' ')"
          echo "Hazır olanlar: $READY"
          python daily.py pick-prepare
      - name: Çizim sürümünü aç
        if: steps.sec.outputs.id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "cizim-${{ steps.sec.outputs.id }}" --cleanup-tag -y --repo "${{ github.repository }}" 2>/dev/null || true
          gh release create "cizim-${{ steps.sec.outputs.id }}" --prerelease --title "Çizim ${{ steps.sec.outputs.id }}" --notes "Ara dosyalar" --repo "${{ github.repository }}"

  ciz:
    needs: sec
    if: needs.sec.outputs.id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 4   # paylaşım işlerine yer kalsın (hesapta aynı anda en fazla 20 iş)
      matrix:
        sahne: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Önbellek (sd.cpp)
        id: sdcache
        uses: actions/cache@v4
        with:
          path: ~/sdbin
          key: sdcpp-cpu-v1
      - name: stable-diffusion.cpp derle
        if: steps.sdcache.outputs.cache-hit != 'true'
        run: |
          git clone --recursive --depth 1 https://github.com/leejet/stable-diffusion.cpp /tmp/sd
          cmake -S /tmp/sd -B /tmp/sd/build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON
          cmake --build /tmp/sd/build --config Release -j4
          mkdir -p ~/sdbin && cp /tmp/sd/build/bin/* ~/sdbin/
      - name: Önbellek (çizim modeli)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-klein4b-v1
      - run: pip install huggingface_hub
      - name: Çiz
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python -m engine.scenes "${{ needs.sec.outputs.path }}" ${{ matrix.sahne }} ~/sdbin/sd-cli out
      - name: Sürüme ekle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls out/*.png >/dev/null 2>&1 || exit 0
          gh release upload "cizim-${{ needs.sec.outputs.id }}" out/*.png --clobber --repo "${{ github.repository }}"

  birlestir:
    needs: [sec, ciz]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Kurulum
        run: |
          AOPT="-o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=3 -o DPkg::Lock::Timeout=60"
          # ffmpeg: Ubuntu apt sunucuları yavaşlayınca takılmamak için önce GitHub'dan hazır derleme
          if ! command -v ffmpeg >/dev/null; then
            for i in 1 2 3; do curl -fsSL --max-time 240 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz -o /tmp/ff.tar.xz && break; sleep 5; done
            tar xJf /tmp/ff.tar.xz -C /tmp 2>/dev/null && sudo cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ff* /usr/local/bin/ || true
          fi
          sudo timeout 300 apt-get update -q $AOPT || echo "::warning::apt update yavaş/başarısız"
          sudo timeout 180 apt-get install -y -q --no-install-recommends $AOPT espeak-ng || echo "::warning::espeak-ng kurulamadı (yedek ses yok)"
          command -v ffmpeg >/dev/null || sudo timeout 600 apt-get install -y -q --no-install-recommends $AOPT ffmpeg || true
          command -v ffmpeg >/dev/null || { echo "::error::ffmpeg kurulamadı"; exit 1; }
          pip install chatterbox-tts huggingface_hub
          pip install -r requirements.txt
          pip install faster-whisper || echo "::warning::faster-whisper kurulamadı, okunuş kontrolü atlanacak"
          pip install transformers || true
      - name: Önbellek (ses modeli)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: chatterbox-mtl-v1
      - name: Ses kaydını çöz
        env:
          VOICE_KEY: ${{ secrets.VOICE_KEY }}
        run: |
          if [ -n "$VOICE_KEY" ] && [ -f assets/voice/aktif ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -in assets/voice/ref.wav.enc -out /tmp/ref.wav -pass env:VOICE_KEY
          else
            echo "::warning::VOICE_KEY yok, hazır ses kullanılacak"
          fi
      - name: Sahneleri al
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "cizim-${{ needs.sec.outputs.id }}" -D img --repo "${{ github.repository }}" && ls img
      - name: Videoyu birleştir
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_VOICE: "Fenrir"
          PYTHONUNBUFFERED: "1"
        run: |
          # assets/voice/gemini dosyası varsa (onaydan sonra) Gemini (Fenrir) sesi kullanılır.
          if [ -n "$GEMINI_API_KEY" ] && [ -f assets/voice/gemini ]; then export VOICE_ENGINE=gemini; fi
          ID="${{ needs.sec.outputs.id }}"
          n=$(python -c "import json;print(len(json.load(open('${{ needs.sec.outputs.path }}'))['scenes']))")
          for i in $(seq 1 $n); do [ -f img/sahne$i.png ] || { echo "::error::sahne$i eksik"; exit 1; }; done
          mkdir -p out && python -m engine.make "${{ needs.sec.outputs.path }}" img "out/${ID}.mp4"
      - name: Ses kaydını sil
        if: always()
        run: rm -f /tmp/ref.wav
      - name: Hazır sürümüne koy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ID="${{ needs.sec.outputs.id }}"
          python daily.py caption "$ID" > notes.txt
          gh release delete "hazir-${ID}" --cleanup-tag -y --repo "${{ github.repository }}" 2>/dev/null || true
          gh release create "hazir-${ID}" "out/${ID}.mp4" --prerelease --title "Hazır ${ID}" --notes-file notes.txt --repo "${{ github.repository }}"
          gh release delete "cizim-${ID}" --cleanup-tag -y --repo "${{ github.repository }}" || true
      - name: Sıradakini başlat
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Sırada bekleyen başka bir Hazırla varsa (elle başlatılmış) onu iptal etmemek için zinciri başlatma
          bekleyen=$(gh api "repos/${{ github.repository }}/actions/workflows/hazirla.yml/runs?per_page=10" \
            --jq '[.workflow_runs[] | select(.status=="queued" or .status=="pending" or .status=="waiting")] | length')
          if [ -n "${{ needs.sec.outputs.rest }}" ]; then
            gh workflow run hazirla.yml -f bolum="${{ needs.sec.outputs.rest }}" --repo "${{ github.repository }}"
          elif [ "$bekleyen" != "0" ]; then
            echo "Sırada bekleyen bir Hazırla var, zincir başlatılmadı."
          else
            gh workflow run hazirla.yml --repo "${{ github.repository }}"
          fi
